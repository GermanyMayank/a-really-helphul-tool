# Test on every push and pull request; deploy to GitHub Pages from main
# only when every test passes.
#
# One-time setting: repo Settings > Pages > Source: "GitHub Actions".

name: Test and deploy

on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the site exactly as it will be deployed
        run: ./scripts/build-site.sh _site "${GITHUB_SHA::8}"
      - name: Serve it
        run: python3 -m http.server 8080 --directory _site &
      - name: Browser tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || { grep -E "^(Error: |[a-zA-Z.]+: Timeout|page\.[a-zA-Z]+: )" test.log | head -2 | sed 's/^/::error title=Failing check::/'; exit 1; }
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (app files only, cache-busted)
        run: ./scripts/build-site.sh _site "${GITHUB_SHA::8}"
      # A "preview" branch, if there is one, goes live at /preview/ next to the
      # real app, so a release can be tried on real devices before it ships.
      - name: Add the preview build at /preview/
        run: |
          if git ls-remote --exit-code --heads origin preview > /dev/null; then
            git fetch --depth 1 origin preview
            git worktree add /tmp/preview FETCH_HEAD
            (cd /tmp/preview && ./scripts/build-site.sh "$GITHUB_WORKSPACE/_site/preview" "pre-$(git rev-parse --short=8 HEAD)")
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
